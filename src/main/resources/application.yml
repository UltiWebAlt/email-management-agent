gmail:
  polling:
    enabled: false
    interval: ${GMAIL_POLL_INTERVAL:PT5M}
    initial-lookback-days: ${GMAIL_INITIAL_LOOKBACK_DAYS:14}
  oauth:
    accounts: ${GMAIL_ACCOUNTS:randall.burgess@ultiweb.com}
    project-id: cs-poc-dxk82jgpd30qog6ii1itvyo
    auth-uri: https://accounts.google.com/o/oauth2/auth
    token-uri: https://oauth2.googleapis.com/token
    auth-provider-x509-cert-url: https://www.googleapis.com/oauth2/v1/certs
    redirect-uris:
      - http://localhost:${GMAIL_OAUTH_CALLBACK_PORT:8888}/Callback
    callback-port: ${GMAIL_OAUTH_CALLBACK_PORT:8888}
    client-id: ${GMAIL_CLIENT_ID}
    client-secret: ${GMAIL_CLIENT_SECRET}

spring:
  profiles:
    default: dev
    group:
      dev:
        - ollama
      production:
        - deepinfra
      local-production:
        - ollama
  datasource:
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON
  sql:
    init:
      mode: never
  ai:
    chat:
      client:
        enabled: false
    model:
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:llama3.2:3b}
        temperature: 0.0

email:
  inference:
    local-max-concurrent-requests: ${OLLAMA_MAX_CONCURRENT_REQUESTS:2}
    tag-system-prompt-location: ${EMAIL_TAG_SYSTEM_PROMPT_LOCATION:classpath:prompts/email-tag-system-prompt.txt}
