import com.github.spotbugs.snom.SpotBugsReport
import com.github.spotbugs.snom.SpotBugsTask

plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.2.0'
    id 'com.github.spotbugs' version '6.5.13'
    id 'org.sonarqube' version '7.6.0.18749'
}

group = 'com.ultiweb.jobs'
version = providers.gradleProperty('projectVersion').get()

tasks.register('release') {
    group = 'build'
    description = 'Bumps the SemVer version, creates a signed Git tag, pushes it, and publishes a GitHub Release.'

    doLast {
        def runCommand = { List<String> command ->
            def process = new ProcessBuilder(command)
                    .directory(rootDir)
                    .redirectErrorStream(true)
                    .start()
            def output = process.inputStream.getText('UTF-8').trim()
            def exitCode = process.waitFor()
            if (exitCode != 0) {
                throw new GradleException("Command failed (${exitCode}): ${command.join(' ')}\n${output}")
            }
            output
        }

        def requestedReleaseType = providers.gradleProperty('releaseType').getOrElse('patch')
        def explicitChannelMatcher = requestedReleaseType =~ /^(beta|rc)\.([1-9]\d*)$/
        def hasExplicitChannelNumber = explicitChannelMatcher.matches()
        def releaseType = hasExplicitChannelNumber ? explicitChannelMatcher[0][1] : requestedReleaseType
        def explicitChannelNumber = hasExplicitChannelNumber ? explicitChannelMatcher[0][2].toInteger() : null
        if (!(releaseType in ['major', 'minor', 'patch', 'snapshot', 'beta', 'rc', 'prerelease', 'stable', 'final'])) {
            throw new GradleException("Invalid releaseType '${requestedReleaseType}'. Use major, minor, patch, snapshot, beta, rc, beta.N, rc.N, prerelease, or stable.")
        }

        def changes = runCommand(['git', 'status', '--porcelain'])
        if (changes) {
            throw new GradleException('Release requires a clean working tree. Commit or stash changes, then retry.')
        }
        def branch = runCommand(['git', 'branch', '--show-current'])
        if (!branch) {
            throw new GradleException('Release requires a checked-out branch; detached HEAD is not supported.')
        }
        if (branch != 'main') {
            throw new GradleException("Release must run from the 'main' branch; current branch is '${branch}'.")
        }
        runCommand(['git', 'remote', 'get-url', 'origin'])
        runCommand(['gh', 'auth', 'status'])

        def currentVersion = providers.gradleProperty('projectVersion').get()
        def matcher = currentVersion =~ /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/
        if (!matcher.matches()) {
            throw new GradleException("projectVersion '${currentVersion}' must be a valid SemVer version.")
        }

        def major = matcher[0][1].toInteger()
        def minor = matcher[0][2].toInteger()
        def patch = matcher[0][3].toInteger()
        def currentPreRelease = matcher[0][4]
        def preReleaseIdentifier = providers.gradleProperty('preReleaseIdentifier').orNull
        def preReleasePattern = /^[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*$/
        def hasInvalidNumericIdentifier = { String identifier ->
            identifier.split('\\.').any { it ==~ /\d+/ && it.length() > 1 && it.startsWith('0') }
        }
        if (currentPreRelease != null && hasInvalidNumericIdentifier(currentPreRelease)) {
            throw new GradleException("projectVersion '${currentVersion}' is not valid SemVer: numeric pre-release identifiers cannot have leading zeroes.")
        }
        if (preReleaseIdentifier != null && (!(preReleaseIdentifier ==~ preReleasePattern) || hasInvalidNumericIdentifier(preReleaseIdentifier))) {
            throw new GradleException("Invalid preReleaseIdentifier '${preReleaseIdentifier}'. Use dot-separated SemVer identifiers without leading zeroes in numeric identifiers.")
        }

        def nextPreRelease = null
        switch (releaseType) {
            case 'major':
                major++
                minor = 0
                patch = 0
                break
            case 'minor':
                minor++
                patch = 0
                break
            case 'patch':
                patch++
                break
            case 'prerelease':
                def identifier = preReleaseIdentifier
                if (identifier == null && currentPreRelease != null) {
                    identifier = currentPreRelease.replaceFirst(/\.\d+$/, '')
                }
                if (identifier == null || identifier.isEmpty()) {
                    throw new GradleException('Starting a pre-release from a stable version requires -PpreReleaseIdentifier, for example -PpreReleaseIdentifier=beta.')
                }
                if (currentPreRelease != null
                        && currentPreRelease ==~ /.*\.\d+$/
                        && identifier == currentPreRelease) {
                    throw new GradleException("preReleaseIdentifier '${identifier}' already includes the current pre-release version; provide the identifier without its numeric counter.")
                }

                def counter = 1
                if (currentPreRelease != null
                        && (preReleaseIdentifier == null || identifier == currentPreRelease.replaceFirst(/\.\d+$/, ''))
                        && currentPreRelease ==~ /.*\.\d+$/) {
                    counter = currentPreRelease.substring(currentPreRelease.lastIndexOf('.') + 1).toInteger() + 1
                }
                nextPreRelease = "${identifier}.${counter}"
                break
            case 'snapshot':
                nextPreRelease = 'SNAPSHOT'
                break
            case 'beta':
            case 'rc':
                def currentChannelPattern = /^${releaseType}\.\d+$/
                def counter = explicitChannelNumber != null
                        ? explicitChannelNumber
                        : currentPreRelease != null && currentPreRelease ==~ currentChannelPattern
                        ? currentPreRelease.substring(currentPreRelease.lastIndexOf('.') + 1).toInteger() + 1
                        : 1
                nextPreRelease = "${releaseType}.${counter}"
                break
            case 'stable':
            case 'final':
                if (currentPreRelease == null) {
                    throw new GradleException("Version '${currentVersion}' is already stable.")
                }
                break
        }

        def nextVersion = "${major}.${minor}.${patch}${nextPreRelease == null ? '' : "-${nextPreRelease}"}"
        def tag = "v${nextVersion}"
        def existingTag = new ProcessBuilder(['git', 'rev-parse', '--verify', '--quiet', "refs/tags/${tag}"])
                .directory(rootDir)
                .redirectErrorStream(true)
                .start()
        existingTag.inputStream.getText('UTF-8')
        if (existingTag.waitFor() == 0) {
            throw new GradleException("Tag '${tag}' already exists.")
        }

        def propertiesFile = layout.projectDirectory.file('gradle.properties').asFile
        def propertiesText = propertiesFile.getText('UTF-8')
        def updatedProperties = propertiesText.replaceFirst(/(?m)^projectVersion=.*/, "projectVersion=${nextVersion}")
        if (updatedProperties == propertiesText) {
            throw new GradleException('Could not find projectVersion in gradle.properties.')
        }
        propertiesFile.write(updatedProperties, 'UTF-8')

        runCommand(['git', 'add', 'gradle.properties'])
        runCommand(['git', 'commit', '-S', '-m', "chore: release ${tag}"])
        runCommand(['git', 'tag', '-s', tag, '-m', "Release ${tag}"])
        runCommand(['git', 'push', 'origin', branch, tag])
        def githubReleaseCommand = ['gh', 'release', 'create', tag, '--title', "Release ${tag}", '--generate-notes']
        if (nextPreRelease != null) {
            githubReleaseCommand.add('--prerelease')
        }
        runCommand(githubReleaseCommand)

        logger.lifecycle("Published GitHub Release ${tag} from ${currentVersion}")
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

sonar {
    properties {
        property 'sonar.host.url', 'http://localhost:9000'
        property 'sonar.projectKey', 'email-management-agent'
        property 'sonar.coverage.exclusions', '.github/scripts/**'
        property 'sonar.coverage.jacoco.xmlReportPaths', file('build/reports/jacoco/test/jacocoTestReport.xml').absolutePath
    }
}

sourceSets {
    integrationTest {
        java {
            compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
            runtimeClasspath += output + compileClasspath
        }
    }
}

configurations {
    developmentOnly
    runtimeClasspath {
        extendsFrom developmentOnly
    }
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.2.0')
    implementation platform('org.springframework.ai:spring-ai-bom:2.1.0')
    implementation platform('org.ow2.asm:asm-bom:9.11.1')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.slf4j:slf4j-api'
    implementation 'org.jsoup:jsoup:1.24.1'
    implementation 'com.google.api-client:google-api-client:2.9.2'
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.39.0'
    implementation 'com.google.apis:google-api-services-gmail:v1-rev20260525-2.0.0'
    implementation 'javax.mail:mail:1.4.7'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    runtimeOnly 'org.xerial:sqlite-jdbc:3.54.1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.hamcrest:hamcrest:3.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    integrationTestImplementation 'com.google.http-client:google-http-client-test:2.2.0'

}

tasks.named('bootRun') {
    systemProperty 'spring.devtools.restart.enabled', 'true'
    sourceResources sourceSets.main
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
    systemProperty 'java.awt.headless', 'true'
    testLogging {
        showStandardStreams = System.getenv('RUN_GMAIL_SEND_INTEGRATION_TEST') == 'true'
                || System.getenv('RUN_GMAIL_OLLAMA_INTEGRATION_TEST') == 'true'
                || System.getenv('RUN_GMAIL_DEEPINFRA_INTEGRATION_TEST') == 'true'
                || System.getenv('RUN_DEEPINFRA_CLASSIFICATION_INTEGRATION_TEST') == 'true'
    }
    useJUnitPlatform()
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
    dependsOn tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test'), tasks.named('integrationTest')
    executionData.from(
            layout.buildDirectory.file('jacoco/test.exec'),
            layout.buildDirectory.file('jacoco/integrationTest.exec'))
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('sonar') {
    dependsOn tasks.named('jacocoTestReport')
}

spotbugs {
    toolVersion = '4.10.4'
    ignoreFailures = false
}

