import com.github.spotbugs.snom.SpotBugsReport
import com.github.spotbugs.snom.SpotBugsTask

plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.0'
    id 'com.github.spotbugs' version '6.5.11'
    id 'org.sonarqube' version '7.3.1.8318'
}

group = 'com.ultiweb.jobs'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

sonar {
    properties {
        property 'sonar.projectKey', 'email-management-agent'
        property 'sonar.coverage.jacoco.xmlReportPaths', file('build/reports/jacoco/test/jacocoTestReport.xml').absolutePath
    }
}

sourceSets {
    integrationTest {
        java {
            compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
            runtimeClasspath += output + compileClasspath
        }
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.0')
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.0')
    implementation platform('org.ow2.asm:asm-bom:9.10.1')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.slf4j:slf4j-api'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'com.google.api-client:google-api-client:2.9.0'
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.39.0'
    implementation 'com.google.apis:google-api-services-gmail:v1-rev20260525-2.0.0'
    implementation 'javax.mail:mail:1.4.7'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    runtimeOnly 'org.xerial:sqlite-jdbc:3.53.4.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    integrationTestImplementation 'com.google.http-client:google-http-client-test:2.0.0'

}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    shouldRunAfter tasks.named('test')
    systemProperty 'java.awt.headless', 'true'
    testLogging {
        showStandardStreams = System.getenv('RUN_GMAIL_SEND_INTEGRATION_TEST') == 'true'
                || System.getenv('RUN_GMAIL_OLLAMA_INTEGRATION_TEST') == 'true'
                || System.getenv('RUN_GMAIL_DEEPINFRA_INTEGRATION_TEST') == 'true'
                || System.getenv('RUN_DEEPINFRA_CLASSIFICATION_INTEGRATION_TEST') == 'true'
    }
    useJUnitPlatform()
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
    dependsOn tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test'), tasks.named('integrationTest')
    executionData.from(
            layout.buildDirectory.file('jacoco/test.exec'),
            layout.buildDirectory.file('jacoco/integrationTest.exec'))
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('sonar') {
    dependsOn tasks.named('jacocoTestReport')
}

spotbugs {
    toolVersion = '4.10.4'
    ignoreFailures = false
}

