name: Build

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 21 / Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: report-pages
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests, integration tests, and validation
        run: ./gradlew clean check --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/jacoco/
            build/reports/spotbugs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare report site
        if: ${{ always() && !cancelled() && github.ref == 'refs/heads/develop' && github.event_name != 'pull_request' && hashFiles('build/reports/tests/**/index.html') != '' }}
        run: python3 .github/scripts/prepare_reports.py build/reports report-site

      - name: Publish test reports to GitHub Pages
        if: ${{ always() && !cancelled() && github.ref == 'refs/heads/develop' && github.event_name != 'pull_request' && hashFiles('report-site/index.html') != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: report-site
          keep_files: true
