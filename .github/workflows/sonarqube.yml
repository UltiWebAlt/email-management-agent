name: Local SonarQube

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-sonarqube-develop
  cancel-in-progress: false

jobs:
  analyze:
    # Track develop as the single analyzed branch of this Community Build project.
    if: github.ref == 'refs/heads/develop'
    name: SonarQube / Local Community Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

    steps:
      - name: Check integration configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: |
          for setting in SONAR_HOST_URL SONAR_TOKEN TS_CLIENT_ID TS_AUDIENCE; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing $setting; see README SonarQube setup."
              exit 1
            fi
          done
          case "$SONAR_HOST_URL" in
            http://*.ts.net|http://*.ts.net:*|https://*.ts.net|https://*.ts.net:*) ;;
            *) echo "::error::SONAR_HOST_URL must use the local server's tailnet DNS name."; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests and validation
        run: ./gradlew clean check --stacktrace

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:sonarqube-ci

      - name: Check local SonarQube availability
        run: curl --fail --silent --show-error --connect-timeout 10 --max-time 30 "$SONAR_HOST_URL/api/system/status"

      - name: Analyze and wait for quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.qualitygate.wait=true --stacktrace

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-sonarqube-test-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/reports/jacoco/
            build/reports/spotbugs/
          if-no-files-found: ignore
          retention-days: 14
